# coturn TURN relay for BhatBall Online Rooms, on Fly.io.
# Needs a DEDICATED IPv4 (fly ips allocate-v4) — shared IPs only serve 80/443.
# Deploy: see tools/turn/fly/README.md
#
# EVERY service block below pins auto_stop_machines = "off",
# auto_start_machines = false and min_machines_running = 1. This is not
# boilerplate: a service block that omits them inherits Fly's autostop default,
# and ONE such block is enough to scale the whole machine to zero. That is what
# happened on 2026-07-21 — the relay-range blocks had no autostop settings, the
# machine stopped, and with auto_start false it never came back. Rooms then
# worked on lenient home wifi (STUN) and silently hung on school/office/cellular
# NAT for seven weeks. Keep these three lines on every block you add.
app = "bhatball-turn"
primary_region = "sjc"

[build]

# Relay port range — must match the fly.toml service blocks below. coturn burns
# one port per ICE agent allocation, and a single client gathers one allocation
# PER TURN URL in window.BHATBALL_ICE (currently 4: 3478/443 × udp/tcp), so the
# old 10-port range capped the relay at ~2 concurrent players. 40 ports ≈ 10.
[env]
  MIN_PORT = "50000"
  MAX_PORT = "50039"

# STUN/TURN signalling port (both transports).
[[services]]
  internal_port = 3478
  protocol = "udp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 3478

# STUN/TURN signalling, TCP.
[[services]]
  internal_port = 3478
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 3478

# TURN on 443 (both transports) via coturn's aux-server. Strict school/office
# firewalls block 3478 but allow 443 (it looks like HTTPS), so this is what makes
# rooms connect on locked-down wifi.
[[services]]
  internal_port = 443
  protocol = "udp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 443

# TURN on 443, TCP.
[[services]]
  internal_port = 443
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 443

# Relay range 50000-50039/udp — one port per ICE agent allocation. Must match
# MIN_PORT/MAX_PORT in [env] above. fly.toml has no port-range syntax, hence the
# explicit blocks.
[[services]]
  internal_port = 50000
  protocol = "udp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 50000

